name: oasis-platform

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oasis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oasis}
      POSTGRES_DB: ${POSTGRES_DB:-oasis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oasis} -d ${POSTGRES_DB:-oasis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-oasis}:${POSTGRES_PASSWORD:-oasis}@db:5432/${POSTGRES_DB:-oasis}
      DATABASE_URL_READONLY: postgresql://${POSTGRES_USER:-oasis}:${POSTGRES_PASSWORD:-oasis}@db:5432/${POSTGRES_DB:-oasis}
      APP_URL: ${APP_URL:-https://oasisimpex.duckdns.org}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://oasisimpex.duckdns.org}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Oasis Impex <no-reply@oasisimpex.in>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-info@oasisimpex.in}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-sandbox}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@oasisimpex.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/repo/apps/web/public/uploads
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-oasis}:${POSTGRES_PASSWORD:-oasis}@db:5432/${POSTGRES_DB:-oasis}
      APP_URL: ${APP_URL:-https://oasisimpex.duckdns.org}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Oasis Impex <no-reply@oasisimpex.in>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-info@oasisimpex.in}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-08:00}
      DAILY_REPORT_TO: ${DAILY_REPORT_TO:-}
      TEAM_WHATSAPP_NUMBERS: ${TEAM_WHATSAPP_NUMBERS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      EMAIL_INBOX_HOST: ${EMAIL_INBOX_HOST:-}
      EMAIL_INBOX_PORT: ${EMAIL_INBOX_PORT:-993}
      EMAIL_INBOX_USER: ${EMAIL_INBOX_USER:-}
      EMAIL_INBOX_PASS: ${EMAIL_INBOX_PASS:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    command: ["sh", "-c", "pnpm --filter @oasis/worker start"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
