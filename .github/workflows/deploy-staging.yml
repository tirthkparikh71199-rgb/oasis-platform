name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/web

jobs:
  build:
    name: Build & push container image (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check:
    name: Can we deploy staging?
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
      ip: ${{ steps.gate.outputs.ip }}
    env:
      VPS_IP_STAGING: ${{ vars.VPS_IP_STAGING }}
      HETZNER_TOKEN_SET: ${{ secrets.HETZNER_API_TOKEN != '' }}
    steps:
      - id: gate
        run: |
          if [ "$HETZNER_TOKEN_SET" = "true" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "HETZNER_API_TOKEN not set — skipping staging deploy." >&2
          fi
          echo "ip=${VPS_IP_STAGING}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: [build, check]
    if: ${{ needs.check.outputs.deployable == 'true' && needs.build.result == 'success' }}
    env:
      VPS_IP: ${{ needs.check.outputs.ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ needs.check.outputs.ip }}

      - name: Copy config to server
        run: |
          ssh -o StrictHostKeyChecking=accept-new "root@$VPS_IP" "mkdir -p /opt/oasis-staging"
          scp docker-compose.yml Caddyfile "root@$VPS_IP:/opt/oasis-staging/"
          printf '%s' '${{ secrets.DEPLOY_ENV_STAGING }}' | ssh "root@$VPS_IP" "cat > /opt/oasis-staging/.env"

      - name: Deploy stack
        run: |
          ssh "root@$VPS_IP" "cd /opt/oasis-staging && \
            (command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh) && \
            docker compose pull web 2>/dev/null || true && \
            docker compose up -d --force-recreate web worker && \
            docker system prune -f --filter 'until=48h'"

      - name: Health check
        run: |
          sleep 20
          for i in $(seq 1 20); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "http://$VPS_IP/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then echo "Healthy ($CODE)"; exit 0; fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
