name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}/web

jobs:
  build:
    name: Build & push container image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check:
    name: Can we deploy?
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
      ip: ${{ steps.gate.outputs.ip }}
    env:
      VPS_IP: ${{ vars.VPS_IP }}
      HETZNER_TOKEN_SET: ${{ secrets.HETZNER_API_TOKEN != '' }}
    steps:
      - id: gate
        run: |
          if [ "$HETZNER_TOKEN_SET" = "true" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "HETZNER_API_TOKEN not set — skipping production deploy." >&2
          fi
          echo "ip=${VPS_IP}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    needs: [build, check]
    if: ${{ needs.check.outputs.deployable == 'true' && needs.build.result == 'success' }}
    env:
      VPS_IP: ${{ needs.check.outputs.ip }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine server IP (provision if needed)
        id: server
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          VPS_SSH_PUBKEY: ${{ secrets.VPS_SSH_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -n "$VPS_IP" ]; then
            echo "ip=$VPS_IP" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat > /tmp/create_server.sh <<'EOF'
          set -euo pipefail
          API="https://api.hetzner.cloud/v1"
          KEY_ID=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$API/ssh_keys?name=oasis-deploy" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["ssh_keys"][0]["id"] if d["ssh_keys"] else "")' || true)
          if [ -z "$KEY_ID" ]; then
            KEY_ID=$(curl -fsS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" -d "{\"name\":\"oasis-deploy\",\"public_key\":\"$VPS_SSH_PUBKEY\"}" "$API/ssh_keys" | python3 -c 'import sys,json;print(json.load(sys.stdin)["ssh_key"]["id"])')
          fi
          IP=$(curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" "$API/servers?name=oasis-impex" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["servers"][0]["public_net"]["ipv4"]["ip"] if d["servers"] else "")' || true)
          if [ -z "$IP" ]; then
            IP=$(curl -fsS -X POST -H "Authorization: Bearer $HCLOUD_TOKEN" -H "Content-Type: application/json" \
              -d '{"name":"oasis-impex","server_type":"cx22","image":"ubuntu-24.04","location":"nbg1","ssh_keys":["'"$KEY_ID"'"],"labels":{"app":"oasis-platform"}}' \
              "$API/servers" | python3 -c 'import sys,json;print(json.load(sys.stdin)["server"]["public_net"]["ipv4"]["ip"])')
          fi
          echo "$IP"
          EOF
          chmod +x /tmp/create_server.sh
          IP=$(bash /tmp/create_server.sh)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH
        env:
          VPS_IP: ${{ steps.server.outputs.ip }}
        run: |
          for i in $(seq 1 40); do
            if ssh-keyscan -T 5 "$VPS_IP" >/dev/null 2>&1; then echo "SSH up"; exit 0; fi
            sleep 15
          done
          echo "Server not reachable yet" >&2
          exit 1

      - name: Update DuckDNS (pre-DNS launch hostname)
        if: env.DUCKDNS_TOKEN != ''
        env:
          VPS_IP: ${{ steps.server.outputs.ip }}
        run: |
          curl -fsS "https://www.duckdns.org/update?domains=oasisimpex&token=${DUCKDNS_TOKEN}&ip=${VPS_IP}" || true

      - name: Install deploy key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ steps.server.outputs.ip }}

      - name: Copy config to server
        env:
          VPS_IP: ${{ steps.server.outputs.ip }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "root@$VPS_IP" "mkdir -p /opt/oasis-platform"
          scp docker-compose.yml Caddyfile "root@$VPS_IP:/opt/oasis-platform/"
          printf '%s' '${{ secrets.DEPLOY_ENV }}' | ssh "root@$VPS_IP" "cat > /opt/oasis-platform/.env"

      - name: Deploy stack
        env:
          VPS_IP: ${{ steps.server.outputs.ip }}
        run: |
          ssh "root@$VPS_IP" "cd /opt/oasis-platform && \
            (command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh) && \
            docker compose pull web 2>/dev/null || true && \
            docker compose up -d --force-recreate web worker && \
            docker system prune -f --filter 'until=48h'"

      - name: Health check
        env:
          VPS_IP: ${{ steps.server.outputs.ip }}
        run: |
          sleep 20
          for i in $(seq 1 20); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "http://$VPS_IP/api/health" 2>/dev/null || echo 000)
            if [ "$CODE" = "200" ]; then echo "Healthy ($CODE)"; exit 0; fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
