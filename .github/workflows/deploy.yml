name: Deploy

# Deploys to the production VPS over SSH. The VPS builds the Docker images
# from source (no external registry needed), then brings up the full stack
# (db + web + worker + caddy) via docker compose.
#
# Triggers:
#   - Automatically after CI succeeds on main
#   - Manually via the "Run workflow" button (workflow_dispatch)
#
# Required GitHub secrets:
#   VPS_SSH_KEY  - private key whose public half is in the VPS authorized_keys
#   VPS_HOST     - VPS IP or hostname (e.g. 160.187.87.93)
#   VPS_PORT     - SSH port (e.g. 62247)
#   VPS_USER     - SSH user (e.g. root)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Deploy on manual dispatch, or when the CI run that triggered us passed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/oasis-platform/"

      - name: Build & bring up stack
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e
             cd /opt/oasis-platform
             command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
             docker compose up -d --build
             docker system prune -f --filter "until=72h" || true'

      - name: Run DB migrate + seed
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'set -e
             cd /opt/oasis-platform
             # wait for db to be healthy, then migrate + seed
             for i in $(seq 1 30); do
               docker compose exec -T db pg_isready -U oasis -d oasis && break
               sleep 3
             done
             docker compose run --rm web pnpm --filter @oasis/db db:migrate || true
             docker compose run --rm web pnpm --filter @oasis/db db:seed || true'

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "https://oasisimpex.duckdns.org/api/health" 2>/dev/null || echo 000)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "Prod is healthy"; exit 0; fi
            sleep 10
          done
          echo "Health check did not pass (site may still be starting / obtaining TLS cert)" >&2
          exit 1
